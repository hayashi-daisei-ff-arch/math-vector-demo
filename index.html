<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ベクトル可視化ラボ</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --text:#172033; --muted:#697386;
    --line:#d8dee9; --accent:#315efb; --accent2:#0f9d78; --warn:#d97706;
    --a:#315efb; --b:#ef5b5b; --c:#0f9d78; --grid:#e8ecf3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
  .app{max-width:1180px;margin:0 auto;padding:20px}
  h1{font-size:1.65rem;margin:0 0 6px}
  h2{font-size:1.05rem;margin:0 0 12px}
  p{margin:0}
  .lead{color:var(--muted);margin-bottom:18px}
  .tabs,.stepbar,.actions{display:flex;gap:8px;flex-wrap:wrap}
  button,select,input{font:inherit}
  button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}
  button:hover{border-color:#9aa7bd}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.secondary{background:#eef2ff;border-color:#cfd8ff;color:#2444bb}
  button.danger{margin-left:auto}
  button:disabled{opacity:.45;cursor:not-allowed}
  .stepbar{margin:14px 0}
  .step{flex:1;min-width:180px;text-align:left;background:#fff}
  .step.done{border-color:#97c8bb;background:#f0fbf7}
  .step.current{border-color:var(--accent);box-shadow:0 0 0 2px #dce5ff inset}
  .layout{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  .controls{display:grid;gap:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{display:grid;gap:6px}
  label{font-size:.9rem;font-weight:650}
  input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--text)}
  input[type=range]{width:100%}
  .hint{font-size:.82rem;color:var(--muted)}
  .formula{font-family:"Cambria Math","STIX Two Math",serif;background:#f7f8fc;border:1px solid var(--line);border-radius:12px;padding:11px;line-height:1.65}
  .vizwrap{display:grid;gap:12px}
  svg{width:100%;height:auto;display:block;background:#fff;border-radius:12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.87rem;color:var(--muted)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:5px}
  .result{display:grid;gap:8px;margin-top:12px}
  .result .big{font-size:1.25rem;font-weight:750}
  .callout{border-left:4px solid var(--accent);background:#f6f8ff;padding:10px 12px;border-radius:8px}
  .rotation{margin-top:14px;display:none}
  .rotation.show{display:block}
  .meter{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;margin-top:8px}
  .meterbar{height:12px;background:#eef1f6;border-radius:999px;position:relative;overflow:hidden}
  .meterfill{position:absolute;left:50%;top:0;height:100%;width:0;background:var(--accent2)}
  .metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .metric{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px}
  .metric b{display:block;font-size:1rem;margin-top:2px}
  .hidden{display:none!important}
  .small{font-size:.86rem;color:var(--muted)}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr}
    .metricgrid{grid-template-columns:1fr}
    button.danger{margin-left:0}
  }
</style>
</head>
<body>
<div class="app">
  <h1>ベクトル可視化ラボ</h1>
  <p class="lead">式だけでなく、「何をしている計算か」を図で確認してから結果を出します。</p>

  <div class="tabs" role="tablist" aria-label="学習モード">
    <button id="tabSingle" class="active" type="button">① 1つのベクトル</button>
    <button id="tabDouble" type="button">② 2つのベクトル</button>
    <button id="resetBtn" class="danger" type="button">リセット</button>
  </div>

  <div class="stepbar" aria-label="操作手順">
    <button id="step1" class="step current" type="button"><b>STEP 1</b><br>計算を選ぶ</button>
    <button id="step2" class="step" type="button" disabled><b>STEP 2</b><br>意味を可視化</button>
    <button id="step3" class="step" type="button" disabled><b>STEP 3</b><br>計算・結果</button>
  </div>

  <div class="layout">
    <section class="card controls">
      <div id="singleInputs">
        <h2>ベクトル a</h2>
        <div class="row">
          <div class="field"><label for="ax">x成分</label><input id="ax" type="number" value="3" step="0.5"></div>
          <div class="field"><label for="ay">y成分</label><input id="ay" type="number" value="2" step="0.5"></div>
        </div>
        <div class="field" style="margin-top:10px">
          <label for="singleOp">表示するもの</label>
          <select id="singleOp">
            <option value="">選択してください</option>
            <option value="components">成分</option>
            <option value="scalar">実数倍</option>
            <option value="unit">単位ベクトル</option>
          </select>
        </div>
        <div id="scalarField" class="field hidden" style="margin-top:10px">
          <label for="k">実数 k</label>
          <input id="k" type="number" value="2" step="0.5">
        </div>
      </div>

      <div id="doubleInputs" class="hidden">
        <h2>ベクトル a, b</h2>
        <div class="row">
          <div class="field"><label for="dax">aₓ</label><input id="dax" type="number" value="3" step="0.5"></div>
          <div class="field"><label for="day">aᵧ</label><input id="day" type="number" value="1" step="0.5"></div>
          <div class="field"><label for="bx">bₓ</label><input id="bx" type="number" value="1" step="0.5"></div>
          <div class="field"><label for="by">bᵧ</label><input id="by" type="number" value="3" step="0.5"></div>
        </div>
        <div class="field" style="margin-top:10px">
          <label for="doubleOp">表示するもの</label>
          <select id="doubleOp">
            <option value="">選択してください</option>
            <option value="add">加算 a + b</option>
            <option value="sub">減算 a − b</option>
            <option value="dot">内積 a · b</option>
            <option value="cross">外積 a × b</option>
          </select>
        </div>
      </div>

      <div id="explanation" class="formula">
        まず「表示するもの」を選びます。
      </div>

      <div class="actions">
        <button id="previewBtn" class="secondary" type="button" disabled>STEP 2：意味を可視化</button>
        <button id="calcBtn" class="primary" type="button" disabled>STEP 3：計算する</button>
      </div>

      <div id="result" class="result" aria-live="polite"></div>

      <div id="rotationPanel" class="rotation">
        <h2>角度を回して確認</h2>
        <div class="field">
          <label for="angleSlider">b の向き：<span id="angleLabel">0°</span></label>
          <input id="angleSlider" type="range" min="0" max="360" value="0" step="1">
          <div class="hint">b の長さは固定し、方向だけ回転します。</div>
        </div>
        <div class="metricgrid">
          <div class="metric">角度 θ<b id="mTheta">0°</b></div>
          <div class="metric">内積 a·b<b id="mDot">0</b></div>
          <div class="metric">外積の大きさ |a×b|<b id="mCross">0</b></div>
        </div>
        <div class="meter">
          <span>−最大</span>
          <div class="meterbar"><div id="dotMeter" class="meterfill"></div></div>
          <span>＋最大</span>
        </div>
        <div style="margin-top:12px">
          <div id="curveTitle" class="small" style="margin-bottom:6px"></div>
          <svg id="curveViz" viewBox="0 0 620 190" role="img" aria-label="角度と内積または外積の関係"></svg>
        </div>
      </div>
    </section>

    <section class="card vizwrap">
      <div>
        <h2 id="vizTitle">ベクトルを入力してください</h2>
        <div id="vizSubtitle" class="small">座標平面上で矢印として表示します。</div>
      </div>
      <svg id="viz" viewBox="0 0 760 520" role="img" aria-label="ベクトルの可視化">
        <defs>
          <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315efb"/></marker>
          <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef5b5b"/></marker>
          <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f9d78"/></marker>
        </defs>
      </svg>
      <div class="legend">
        <span><i class="dot" style="background:var(--a)"></i>a</span>
        <span><i class="dot" style="background:var(--b)"></i>b</span>
        <span><i class="dot" style="background:var(--c)"></i>計算結果・補助</span>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = {
    mode:'single', stage:1, preview:false, calculated:false,
    rotate:false, baseBMag:Math.sqrt(10)
  };

  const svg = $('viz');
  const origin = {x:380,y:260};
  const scale = 58;

  function n(v){ const x=Number(v); return Number.isFinite(x)?x:0; }
  function fmt(x){
    if(!Number.isFinite(x)) return '0';
    const y=Math.abs(x)<1e-10?0:x;
    return (Math.round(y*1000)/1000).toString();
  }
  function clampVec(v){
    const lim=5.5;
    const m=Math.max(Math.abs(v.x),Math.abs(v.y));
    if(m<=lim) return v;
    const s=lim/m;
    return {x:v.x*s,y:v.y*s};
  }
  function pt(v){ const q=clampVec(v); return {x:origin.x+q.x*scale,y:origin.y-q.y*scale}; }
  function line(x1,y1,x2,y2,stroke,width=2,dash='',marker=''){
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''} ${marker?`marker-end="url(#${marker})"`:''}/>`;
  }
  function text(x,y,t,fill='#172033',anchor='start',size=16,weight=600){
    return `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" font-family="system-ui, sans-serif">${t}</text>`;
  }
  function arrow(v,color,marker,label,from={x:0,y:0}){
    const p0=pt(from), p1=pt({x:from.x+v.x,y:from.y+v.y});
    return line(p0.x,p0.y,p1.x,p1.y,color,4,'',marker)+text(p1.x+10,p1.y-8,label,color,'start',17,750);
  }
  function grid(){
    let g='';
    for(let i=-6;i<=6;i++){
      const x=origin.x+i*scale, y=origin.y-i*scale;
      g+=line(x,0,x,520,'#e8ecf3',1);
      g+=line(0,y,760,y,'#e8ecf3',1);
      if(i!==0){
        g+=text(x,origin.y+19,String(i),'#8a94a6','middle',11,500);
        g+=text(origin.x-10,y+4,String(i),'#8a94a6','end',11,500);
      }
    }
    g+=line(20,origin.y,740,origin.y,'#9aa7bd',1.5,'','');
    g+=line(origin.x,500,origin.x,20,'#9aa7bd',1.5,'','');
    g+=text(742,origin.y-8,'x','#697386','end',13,650);
    g+=text(origin.x+10,24,'y','#697386','start',13,650);
    return g;
  }

  function getA(){
    return S.mode==='single'?{x:n($('ax').value),y:n($('ay').value)}:{x:n($('dax').value),y:n($('day').value)};
  }
  function getB(){
    if(S.rotate){
      const deg=n($('angleSlider').value), r=deg*Math.PI/180;
      return {x:S.baseBMag*Math.cos(r),y:S.baseBMag*Math.sin(r)};
    }
    return {x:n($('bx').value),y:n($('by').value)};
  }
  function mag(v){ return Math.hypot(v.x,v.y); }
  function dot(a,b){ return a.x*b.x+a.y*b.y; }
  function cross(a,b){ return a.x*b.y-a.y*b.x; }
  function angleBetween(a,b){
    const ma=mag(a),mb=mag(b); if(ma===0||mb===0) return 0;
    const c=Math.max(-1,Math.min(1,dot(a,b)/(ma*mb)));
    return Math.acos(c)*180/Math.PI;
  }
  function op(){
    return S.mode==='single'?$('singleOp').value:$('doubleOp').value;
  }

  function setStage(stage){
    S.stage=stage;
    $('step1').className='step '+(stage===1?'current':stage>1?'done':'');
    $('step2').className='step '+(stage===2?'current':stage>2?'done':'');
    $('step3').className='step '+(stage===3?'current':'');
  }

  function updateControls(){
    const chosen=!!op();
    $('previewBtn').disabled=!chosen;
    $('step2').disabled=!chosen;
    $('calcBtn').disabled=!S.preview;
    $('step3').disabled=!S.preview;
    $('scalarField').classList.toggle('hidden', $('singleOp').value!=='scalar');
  }

  function explain(){
    const o=op();
    const map={
      components:'a = (aₓ, aᵧ)。x方向とy方向への「分解」として成分を見ます。',
      scalar:'k a は、向きを保ったまま長さを |k| 倍します。k < 0 なら向きが反転します。',
      unit:'a / |a| は、a と同じ向きで長さだけを 1 にそろえたベクトルです。',
      add:'a + b は、a の先端から b をつなぐ「三角形則」で見ます。',
      sub:'a − b = a + (−b)。つまり b と逆向きのベクトルを足します。',
      dot:'a·b は、a を b の方向へ射影した「符号付き長さ」と |b| の積です。直交なら射影が 0 なので内積も 0。',
      cross:'2次元では a×b の z 成分 aₓbᵧ−aᵧbₓ を見ます。絶対値は a,b が作る平行四辺形の面積です。平行なら面積 0。'
    };
    $('explanation').textContent=map[o]||'まず「表示するもの」を選びます。';
  }

  function baseRender(){
    const a=getA(), b=getB(), o=op();
    let s=grid();
    if(S.mode==='single'){
      s+=arrow(a,'#315efb','arrowA','a');
      if(S.preview && o==='components'){
        const px=pt({x:a.x,y:0}), pa=pt(a);
        s+=line(origin.x,origin.y,px.x,px.y,'#0f9d78',3,'6 5');
        s+=line(px.x,px.y,pa.x,pa.y,'#0f9d78',3,'6 5');
        s+=text((origin.x+px.x)/2,origin.y-10,`x成分 ${fmt(a.x)}`,'#0f9d78','middle',14,650);
        s+=text(px.x+10,(px.y+pa.y)/2,`y成分 ${fmt(a.y)}`,'#0f9d78','start',14,650);
      }
      if(S.preview && o==='scalar'){
        const k=n($('k').value), ka={x:k*a.x,y:k*a.y};
        s+=arrow(ka,'#0f9d78','arrowC','k a');
      }
      if(S.preview && o==='unit' && mag(a)>0){
        const u={x:a.x/mag(a),y:a.y/mag(a)};
        s+=arrow(u,'#0f9d78','arrowC','êₐ');
      }
    }else{
      s+=arrow(a,'#315efb','arrowA','a');
      s+=arrow(b,'#ef5b5b','arrowB','b');
      if(S.preview && o==='add'){
        const c={x:a.x+b.x,y:a.y+b.y};
        s+=arrow(b,'#ef5b5b','arrowB','b',{x:a.x,y:a.y});
        s+=arrow(c,'#0f9d78','arrowC','a+b');
      }
      if(S.preview && o==='sub'){
        const nb={x:-b.x,y:-b.y}, c={x:a.x-b.x,y:a.y-b.y};
        s+=arrow(nb,'#ef5b5b','arrowB','−b',{x:a.x,y:a.y});
        s+=arrow(c,'#0f9d78','arrowC','a−b');
      }
      if(S.preview && o==='dot'){
        const bb=dot(b,b);
        if(bb>0){
          const t=dot(a,b)/bb;
          const proj={x:t*b.x,y:t*b.y};
          const pp=pt(proj), pa=pt(a);
          s+=arrow(proj,'#0f9d78','arrowC','proj');
          s+=line(pa.x,pa.y,pp.x,pp.y,'#0f9d78',2,'6 5');
          s+=text(pp.x+10,pp.y+18,'射影','#0f9d78','start',14,700);
        }
      }
      if(S.preview && o==='cross'){
        const pa=pt(a), pb=pt(b), pc=pt({x:a.x+b.x,y:a.y+b.y});
        const po=pt({x:0,y:0});
        s+=`<polygon points="${po.x},${po.y} ${pa.x},${pa.y} ${pc.x},${pc.y} ${pb.x},${pb.y}" fill="rgba(15,157,120,.15)" stroke="#0f9d78" stroke-width="2"/>`;
        s+=text(pc.x+8,pc.y-8,'平行四辺形','#0f9d78','start',14,700);
      }
      if(S.preview && (o==='dot'||o==='cross')){
        const th=angleBetween(a,b);
        s+=text(28,38,`θ = ${fmt(th)}°`,'#697386','start',16,700);
      }
    }
    svg.innerHTML=svg.querySelector('defs')?.outerHTML||'' + s;
    // defs can be lost by previous innerHTML set; ensure markers exist
    if(!svg.querySelector('defs')){
      svg.innerHTML=`<defs>
        <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315efb"/></marker>
        <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef5b5b"/></marker>
        <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f9d78"/></marker>
      </defs>`+s;
    } else {
      const defs=svg.querySelector('defs').outerHTML;
      svg.innerHTML=defs+s;
    }
  }

  function renderResult(){
    const a=getA(), b=getB(), o=op();
    let h='';
    if(S.mode==='single'){
      if(o==='components'){
        h=`<div class="big">a = (${fmt(a.x)}, ${fmt(a.y)})</div>
           <div class="callout">x方向に ${fmt(a.x)}、y方向に ${fmt(a.y)} 進むベクトル。</div>`;
      }else if(o==='scalar'){
        const k=n($('k').value), c={x:k*a.x,y:k*a.y};
        h=`<div class="big">${fmt(k)}a = (${fmt(c.x)}, ${fmt(c.y)})</div>
           <div>長さ：|a|=${fmt(mag(a))} → |${fmt(k)}a|=${fmt(mag(c))}</div>`;
      }else if(o==='unit'){
        const m=mag(a);
        if(m===0) h='<div class="callout">ゼロベクトルは長さが 0 のため、単位ベクトルを定義できません。</div>';
        else {
          const u={x:a.x/m,y:a.y/m};
          h=`<div>|a| = √(${fmt(a.x)}² + ${fmt(a.y)}²) = ${fmt(m)}</div>
             <div class="big">êₐ = (${fmt(u.x)}, ${fmt(u.y)})</div>
             <div>|êₐ| = 1</div>`;
        }
      }
    }else{
      if(o==='add'){
        const c={x:a.x+b.x,y:a.y+b.y};
        h=`<div>(${fmt(a.x)}, ${fmt(a.y)}) + (${fmt(b.x)}, ${fmt(b.y)})</div>
           <div class="big">a+b = (${fmt(c.x)}, ${fmt(c.y)})</div>`;
      }else if(o==='sub'){
        const c={x:a.x-b.x,y:a.y-b.y};
        h=`<div>(${fmt(a.x)}, ${fmt(a.y)}) − (${fmt(b.x)}, ${fmt(b.y)})</div>
           <div class="big">a−b = (${fmt(c.x)}, ${fmt(c.y)})</div>`;
      }else if(o==='dot'){
        const d=dot(a,b), bb=dot(b,b), mb=mag(b);
        if(bb===0) h='<div class="callout">b がゼロベクトルなので、b 方向への射影は定義できません。</div>';
        else{
          const scalarProj=d/mb;
          const proj={x:(d/bb)*b.x,y:(d/bb)*b.y};
          h=`<div>proj<sub>b</sub>(a) = (${fmt(proj.x)}, ${fmt(proj.y)})</div>
             <div>符号付き射影長 = a·b / |b| = ${fmt(scalarProj)}</div>
             <div class="big">a·b = ${fmt(scalarProj)} × ${fmt(mb)} = ${fmt(d)}</div>
             <div class="callout">θ=${fmt(angleBetween(a,b))}°。90°なら射影長が 0 → 内積も 0。</div>`;
        }
      }else if(o==='cross'){
        const c=cross(a,b), area=Math.abs(c);
        h=`<div>a×b の z成分 = aₓbᵧ − aᵧbₓ</div>
           <div class="big">a×b = (0, 0, ${fmt(c)})</div>
           <div>平行四辺形の面積 = |a×b| = <b>${fmt(area)}</b></div>
           <div class="callout">θ=${fmt(angleBetween(a,b))}°。平行なら面積 0、直交なら面積が最大。</div>`;
      }
    }
    $('result').innerHTML=h;
  }

  function drawCurve(){
    const cv=$('curveViz');
    const a=getA();
    const M=Math.max(1e-9,mag(a)*S.baseBMag);
    const o=op();
    const w=620,h=190,L=42,R=14,T=14,B=30;
    const pw=w-L-R, ph=h-T-B;
    const x=d=>L+(d/360)*pw;
    let y, points='', zeroY;
    if(o==='dot'){
      y=v=>T+((M-v)/(2*M))*ph;
      zeroY=y(0);
      for(let d=0;d<=360;d+=3){
        const v=M*Math.cos(d*Math.PI/180);
        points+=`${x(d)},${y(v)} `;
      }
      $('curveTitle').textContent='内積 a·b = |a||b| cos θ：90°・270°で 0、180°で最小';
    }else{
      y=v=>T+((M-v)/M)*ph;
      zeroY=y(0);
      for(let d=0;d<=360;d+=3){
        const v=M*Math.abs(Math.sin(d*Math.PI/180));
        points+=`${x(d)},${y(v)} `;
      }
      $('curveTitle').textContent='平行四辺形の面積 |a×b| = |a||b||sin θ|：平行で 0、直交で最大';
    }
    const deg=n($('angleSlider').value);
    const val=o==='dot'?M*Math.cos(deg*Math.PI/180):M*Math.abs(Math.sin(deg*Math.PI/180));
    let s='';
    s+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="#fbfcfe" stroke="#d8dee9"/>`;
    [0,90,180,270,360].forEach(d=>{
      s+=`<line x1="${x(d)}" y1="${T}" x2="${x(d)}" y2="${T+ph}" stroke="#e8ecf3"/>`;
      s+=`<text x="${x(d)}" y="${h-9}" text-anchor="middle" font-size="11" fill="#697386">${d}°</text>`;
    });
    s+=`<line x1="${L}" y1="${zeroY}" x2="${L+pw}" y2="${zeroY}" stroke="#9aa7bd" stroke-width="1.2"/>`;
    s+=`<polyline points="${points}" fill="none" stroke="#0f9d78" stroke-width="3"/>`;
    s+=`<line x1="${x(deg)}" y1="${T}" x2="${x(deg)}" y2="${T+ph}" stroke="#315efb" stroke-width="2" stroke-dasharray="5 4"/>`;
    s+=`<circle cx="${x(deg)}" cy="${y(val)}" r="5" fill="#315efb"/>`;
    cv.innerHTML=s;
  }

  function updateRotationMetrics(){
    const a=getA(), b=getB();
    const theta=angleBetween(a,b), d=dot(a,b), c=Math.abs(cross(a,b));
    $('mTheta').textContent=fmt(theta)+'°';
    $('mDot').textContent=fmt(d);
    $('mCross').textContent=fmt(c);
    const max=Math.max(1e-9,mag(a)*mag(b));
    const ratio=Math.max(-1,Math.min(1,d/max));
    const meter=$('dotMeter');
    if(ratio>=0){ meter.style.left='50%'; meter.style.width=(ratio*50)+'%'; }
    else { meter.style.left=(50+ratio*50)+'%'; meter.style.width=(-ratio*50)+'%'; }
    $('angleLabel').textContent=$('angleSlider').value+'°';
    drawCurve();
  }

  function preview(){
    if(!op()) return;
    S.preview=true; S.calculated=false; S.rotate=false;
    setStage(2); updateControls(); explain(); $('result').innerHTML='';
    $('rotationPanel').classList.remove('show');
    $('vizTitle').textContent='計算の意味を図で確認';
    $('vizSubtitle').textContent='まだ答えは出さず、幾何学的な操作だけを表示しています。';
    baseRender();
  }

  function calculate(){
    if(!S.preview) return;
    S.calculated=true; setStage(3);
    renderResult();
    const o=op();
    if(S.mode==='double'&&(o==='dot'||o==='cross')){
      const b={x:n($('bx').value),y:n($('by').value)};
      S.baseBMag=mag(b)||1;
      S.rotate=true;
      const deg=(Math.atan2(b.y,b.x)*180/Math.PI+360)%360;
      $('angleSlider').value=Math.round(deg);
      $('rotationPanel').classList.add('show');
      updateRotationMetrics();
    }
    $('vizTitle').textContent='計算結果';
    $('vizSubtitle').textContent=(o==='dot'||o==='cross')?'下の角度スライダーで b を回転させると値も連動します。':'成分計算と図形的な意味を対応させています。';
    baseRender();
  }

  function reset(){
    S.mode='single'; S.preview=false; S.calculated=false; S.rotate=false; setStage(1);
    $('tabSingle').classList.add('active'); $('tabDouble').classList.remove('active');
    $('singleInputs').classList.remove('hidden'); $('doubleInputs').classList.add('hidden');
    $('ax').value=3; $('ay').value=2; $('k').value=2; $('singleOp').value='';
    $('dax').value=3; $('day').value=1; $('bx').value=1; $('by').value=3; $('doubleOp').value='';
    $('result').innerHTML=''; $('rotationPanel').classList.remove('show');
    $('explanation').textContent='まず「表示するもの」を選びます。';
    $('vizTitle').textContent='ベクトルを入力してください';
    $('vizSubtitle').textContent='座標平面上で矢印として表示します。';
    updateControls(); baseRender();
  }

  function switchMode(mode){
    S.mode=mode; S.preview=false; S.calculated=false; S.rotate=false; setStage(1);
    $('tabSingle').classList.toggle('active',mode==='single');
    $('tabDouble').classList.toggle('active',mode==='double');
    $('singleInputs').classList.toggle('hidden',mode!=='single');
    $('doubleInputs').classList.toggle('hidden',mode!=='double');
    $('result').innerHTML=''; $('rotationPanel').classList.remove('show');
    explain(); updateControls(); baseRender();
  }

  $('tabSingle').addEventListener('click',()=>switchMode('single'));
  $('tabDouble').addEventListener('click',()=>switchMode('double'));
  $('resetBtn').addEventListener('click',reset);
  $('previewBtn').addEventListener('click',preview);
  $('calcBtn').addEventListener('click',calculate);
  $('step2').addEventListener('click',preview);
  $('step3').addEventListener('click',calculate);

  $('singleOp').addEventListener('change',()=>{S.preview=false;S.calculated=false;S.rotate=false;setStage(1);$('result').innerHTML='';$('rotationPanel').classList.remove('show');explain();updateControls();baseRender();});
  $('doubleOp').addEventListener('change',()=>{S.preview=false;S.calculated=false;S.rotate=false;setStage(1);$('result').innerHTML='';$('rotationPanel').classList.remove('show');explain();updateControls();baseRender();});

  ['ax','ay','k','dax','day','bx','by'].forEach(id=>{
    $(id).addEventListener('input',()=>{
      if(S.calculated) renderResult();
      baseRender();
    });
  });

  $('angleSlider').addEventListener('input',()=>{
    if(!S.rotate) return;
    updateRotationMetrics();
    renderResult();
    baseRender();
  });

  updateControls();
  baseRender();
})();
</script>
</body>
</html>
